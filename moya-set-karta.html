<style>html.hbp-wait #root{visibility:hidden}
body{margin:0;background:var(--hb-page)}
html.hbp-top{--hb-kab-vh:calc(100dvh - var(--hbp-h,32px))}
.hbp{display:flex;flex-wrap:wrap;align-items:center;gap:2px 16px;padding:6px 16px;background:#121517;color:#fff;font:500 13px/20px "IBM Plex Sans",system-ui,sans-serif}
.hbp b{font-weight:600}
.hbp__b{appearance:none;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.55);border-radius:0;color:#fff;font:inherit;padding:0;margin:0;cursor:pointer;min-height:24px}
.hbp__b:hover{border-bottom-color:#fff}
.hbp__s{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbp__s select{font:inherit;color:#121517;background:#fff;border:0;border-radius:6px;padding:2px 6px;max-width:58vw}
.hbp :focus-visible{outline:2px solid #DAF1DC;outline-offset:2px}
.hbp__a{display:none}
@media (max-width:480px){.hbp{flex-wrap:nowrap;gap:8px;padding:4px 12px;height:44px;box-sizing:border-box}.hbp__m,.hbp__b{display:none}.hbp__a{display:block;font:inherit;color:#121517;background:#fff;border:0;border-radius:6px;padding:2px 6px;max-width:44vw}.hbp__s{margin-left:auto;gap:0;font-size:0}.hbp__s select{font-size:13px;max-width:44vw}}
.hbp-toast{position:fixed;z-index:400;left:50%;bottom:96px;transform:translateX(-50%);max-width:min(440px,calc(100vw - 24px));padding:12px 16px;border-radius:12px;background:#121517;color:#fff;font:15px/1.4 "IBM Plex Sans",system-ui,sans-serif;box-shadow:0 10px 30px -12px rgba(18,21,23,.4)}
.hbp-toast[hidden]{display:none}</style>
</head>
<body>
<div id="root"></div>
<noscript>Для прототипа нужен включённый JavaScript.</noscript>

<script src="assets/dc.js"></script>
</body>
</html>
